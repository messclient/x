<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Downloader</title>
  <style>
    body {background-color: #121212; color: #e0e0e0; font-family: 'Comic Sans MS', cursive, sans-serif; text-align: center; padding: 50px; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;}
    h2 {font-size: 2em; margin-bottom: 20px; color: #e0e0e0; text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);}
    #progressBar {width: 100%; max-width: 600px; background-color: #333; border-radius: 5px; height: 30px; box-shadow: inset 0px 0px 10px rgba(0, 0, 0, 0.3); overflow: hidden;}
    #progressBar div {width: 0%; height: 100%; background-color: #4caf50; transition: width 0.2s; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff;}
    .footer {position: fixed; bottom: 20px; width: 100%; text-align: center; color: #888; font-size: 0.8em;}
  </style>
</head>
<body>
  <h2>Downloading Update...</h2>
  <div id="progressBar"><div>0%</div></div>
  <div class="footer">Please wait while we download the update...</div>

  <script>
    (async function() {
      'use strict';

      const DB_NAME = 'loaderDB';
      const DB_VERSION = 1;
      const STORE_NAME = 'files';
      const CLIENT_URL = 'https://messclient.github.io/x/26/v02.bin';

      // Cache by file name only. Moving the client to another domain/path keeps
      // the cache valid, and renaming the versioned file (v02.bin -> v03.bin)
      // is what forces a fresh download.
      const CLIENT_FILE = CLIENT_URL.substring(CLIENT_URL.lastIndexOf('/') + 1);

      function openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'url' });
            }
          };
          request.onsuccess = (e) => resolve(e.target.result);
          request.onerror = (e) => reject(e.target.error);
        });
      }

      function getFile(db, key) {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([STORE_NAME], 'readonly');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.get(key);
          request.onsuccess = (e) => resolve(e.target.result);
          request.onerror = (e) => reject(e.target.error);
        });
      }

      function getAllKeys(db) {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([STORE_NAME], 'readonly');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.getAllKeys();
          request.onsuccess = () => resolve(request.result);
          request.onerror = (e) => reject(e.target.error);
        });
      }

      // The previous loader keyed entries by full URL. Reuse such an entry (e.g.
      // cached under the old domain) instead of downloading the client again.
      async function migrateLegacyEntry(db) {
        const keys = await getAllKeys(db);
        const legacyKey = keys.find((key) =>
          typeof key === 'string' && key !== CLIENT_FILE && key.endsWith('/' + CLIENT_FILE)
        );
        if (!legacyKey) return null;

        const legacy = await getFile(db, legacyKey);
        if (!legacy || !legacy.content) return null;

        await saveFile(db, { url: CLIENT_FILE, content: legacy.content });
        await deleteFile(db, legacyKey).catch(() => {});
        return legacy;
      }

      function saveFile(db, file) {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([STORE_NAME], 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.put(file);
          request.onsuccess = () => resolve();
          request.onerror = (e) => reject(e.target.error);
        });
      }

      function deleteFile(db, key) {
        return new Promise((resolve, reject) => {
          const transaction = db.transaction([STORE_NAME], 'readwrite');
          const store = transaction.objectStore(STORE_NAME);
          const request = store.delete(key);
          request.onsuccess = () => resolve();
          request.onerror = (e) => reject(e.target.error);
        });
      }

      function updateProgress(percent) {
        const bar = document.querySelector('#progressBar div');
        if (bar) {
            bar.style.width = percent + '%';
            bar.textContent = percent + '%';
        }
      }

      function loadFile(url) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.responseType = 'text';

          xhr.onprogress = (e) => {
            if (e.lengthComputable) {
              updateProgress(Math.round((e.loaded / e.total) * 100));
            }
          };

          xhr.onreadystatechange = () => {
            if (xhr.readyState === XMLHttpRequest.DONE) {
              if (xhr.status >= 200 && xhr.status < 300) {
                resolve(xhr.responseText);
              } else {
                reject('Error loading file: ' + xhr.status);
              }
            }
          };
          xhr.onerror = () => reject('XHR Network error');
          xhr.send();
        });
      }

      function render(content) {
        document.open();
        document.write(content);
        document.close();
      }

      async function init() {
        try {
          const db = await openDB();

          // Cache hit: no network request at all.
          let cached = await getFile(db, CLIENT_FILE);
          if (!cached || !cached.content) {
            cached = await migrateLegacyEntry(db);
          }
          if (cached && cached.content) {
            updateProgress(100);
            render(cached.content);
            return;
          }

          const fileContent = await loadFile(CLIENT_URL);
          await saveFile(db, { url: CLIENT_FILE, content: fileContent });

          // Drop the entry written by the old URL-keyed loader to reclaim space.
          await deleteFile(db, CLIENT_URL).catch(() => {});

          render(fileContent);
        } catch (e) {
          console.error(e);
          document.body.innerHTML = '<h2 style="color:red">Error</h2><p>' + e + '</p>';
        }
      }

      init();
    })();
  </script>
</body>
</html>
